<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed — C4 Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #c41e3a; --dark: #111; }
    body { font-family: 'Inter', sans-serif; background: #f8f8f8; color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .icon { font-size: 4rem; margin-bottom: 16px; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: .04em; margin-bottom: 12px; }
    h1 span { color: var(--red); }
    p { font-size: 1.05rem; color: #555; max-width: 420px; margin: 0 auto 32px; line-height: 1.7; }
    .btn { display: inline-block; background: var(--red); color: #fff; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; padding: 13px 32px; border-radius: 100px; text-decoration: none; letter-spacing: .04em; text-transform: uppercase; margin: 0 6px 10px; transition: opacity .2s; }
    .btn:hover { opacity: .88; }
    .btn-outline { background: transparent; border: 1.5px solid #ddd; color: var(--dark); }
  </style>
</head>
<body>
  <div class="icon">🎉</div>
  <h1>You're <span>Booked!</span></h1>
  <p>Your deposit is in and your session is confirmed. Check your email for a confirmation. We'll be in touch with details.</p>
  <div>
    <a href="/index.html" class="btn">Back to Home</a>
    <a href="/services/recording-studio.html" class="btn btn-outline">Book Another Session</a>
  </div>
</body>
</html>
